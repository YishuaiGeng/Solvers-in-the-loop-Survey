name: Validate companion release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate data, catalogues and release fingerprints
        run: python -B scripts/validate.py
      - name: Test publication guardrails
        run: python -B -m unittest discover -s tests
